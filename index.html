<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Be My Valentine?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="heart-animation">
      <div class="heart"></div>
      <div class="heart"></div>
    </div>

    <img src="lover.jpg" alt="Valentine's Image" class="valentine-img">
    
    <h1>Will You Be My Valentine?</h1>
    <p class="message">You're the only person i want to spend this special day with... my lover. ❤️</p>
    <button class="btn" id="yes-btn">Yes, I will!</button>
    <button class="btn" id="no-btn">Not this year...</button>
    <div id="response-message" class="hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
